<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Poem (Colored + Ultra-Fast Typing)</title>
  <style>
    body {
      background-color: #000;             /* Black background */
      color: #fff;                        /* White text */
      font-family: "Courier New", monospace; /* Monospaced font for alignment */
      margin: 0;
      padding: 1rem;
    }
    #poem {
      white-space: pre;                  /* Preserve exact spacing/newlines */
      font-family: "Courier New", monospace;
      font-size: 16px;                   /* Adjust to taste */
      line-height: 1.2;                  /* Slight spacing for ASCII readability */
      overflow-wrap: normal;             /* No word-wrapping if possible */
      word-wrap: normal;
    }
    /* Simple blinking cursor */
    #cursor {
      display: inline-block;
      width: 8px;
      background-color: #fff;
      margin-left: 2px;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="poem"></div><div id="cursor"></div>

<script>

█  ████████  ████  ██  ████  ██  ███  ██████  █████  ████████        ██  ████  ███  ██  ██
█  █████████      ████      ███  ████  █████  █████        ██  ████  ███      ███  ████  █
                                                                                    
                                                                                
  )"</span> &lt;&lt; endl;

    <span style="color: #C792EA;">return</span> 0;
}
</span>
`;

// We'll type the code at 1 ms per character (extremely fast)
let i = 0;
const speed = 1;  // ms per character

function typeChar() {
  document.getElementById('poem').innerHTML = codePoem.slice(0, i);
  i++;
  if (i <= codePoem.length) {
    setTimeout(typeChar, speed);
  }
}

// Start the typing
typeChar();
</script>

</body>
</html>
